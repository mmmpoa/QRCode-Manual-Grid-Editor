<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Grid Editor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>QR Code Grid Editor</h1>
    <p>Click on the grid to toggle cells between black and white.</p>
    <label for="gridSize">Grid Size:</label>
    <input type="number" id="gridSize" min="21" max="40" value="21">
    <button id="updateGridButton">Update Grid</button>
    <div class="grid" id="grid"></div> <!-- Grid container -->
    <button id="resetButton">Reset Grid</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
